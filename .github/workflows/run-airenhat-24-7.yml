name: AI Re Nhat Dedicated 24/7 Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: airenhat-dedicated-24-7-single-instance
  cancel-in-progress: false

jobs:
  run-airenhat-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone & Start AI Re Nhat (@airenhatbot) Alone on Dedicated Server 24/7
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PYTHONUTF8: "1"
          QUIET_STARTUP: "1"
        run: |
          git config --global user.name "Airenhat AutoSave"
          git config --global user.email "airenhat@users.noreply.github.com"

          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          git clone https://x-access-token:${PAT_TOKEN}@github.com/alexandratodika/unified-tele-shop-bot.git airenhat
          pip install --upgrade pip
          pip install -r airenhat/requirements.txt

          save_airenhat_state() {
            (
              cd airenhat
              python -c "import os, sqlite3; [(c := sqlite3.connect(f, timeout=15), c.execute('PRAGMA wal_checkpoint(TRUNCATE)'), c.close()) for f in ('shop_data.db',) if os.path.exists(f)]" 2>/dev/null || true
              shopt -s nullglob
              for f in shop_data.db canboso_cache.json roboticvn_cache.json thomap_userbot.session auto_ads_config.json ads_userbot.session auto_ads_media.*; do
                if [ -f "$f" ]; then
                  git add -f "$f" 2>/dev/null || true
                fi
              done
              if ! git diff --cached --quiet; then
                git commit -m "chore: auto-save airenhat db & cache [skip ci]" || true
                if ! git pull --rebase -X ours origin main; then
                  git rebase --abort 2>/dev/null || true
                  git fetch origin main || true
                  git reset origin/main || true
                  for f in shop_data.db canboso_cache.json roboticvn_cache.json thomap_userbot.session auto_ads_config.json ads_userbot.session auto_ads_media.*; do
                    if [ -f "$f" ]; then git add -f "$f" 2>/dev/null || true; fi
                  done
                  git commit -m "chore: auto-save airenhat db & cache [skip ci]" || true
                fi
                git push origin main || true
              fi
            )
          }

          # Auto-save database & catalog cache every 180 seconds
          (
            while true; do
              sleep 180
              save_airenhat_state
            done
          ) &
          AUTOSAVE_PID=$!

          # Launch @airenhatbot's local Userbot Hub (supplier QR + AutoAds + authenticated bridge)
          (
            cd airenhat
            START_TIME=$SECONDS
            while [ $((SECONDS - START_TIME)) -lt 19500 ]; do
              REMAINING=$((19500 - (SECONDS - START_TIME)))
              if [ $REMAINING -le 0 ]; then break; fi
              timeout --signal=SIGINT ${REMAINING}s python -X utf8 userbot_hub.py || true
              sleep 3
            done
          ) &

          # Publish lightweight authenticated tunnel URL to consumer repos
          (
            while true; do
              rm -f /tmp/cf_hub.log
              cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8099 > /tmp/cf_hub.log 2>&1 &
              CF_PID=$!
              for _i in $(seq 1 25); do
                sleep 1
                CF_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf_hub.log | head -n 1 || true)
                if [ -n "$CF_URL" ]; then
                  python -X utf8 airenhat/publish_hub_tunnel.py "$CF_URL" || true
                  break
                fi
              done
              wait "$CF_PID" || true
              sleep 5
            done
          ) &

          sleep 3

          # Launch @airenhatbot 24/7 supervisor (100% alone on this server)
          (
            cd airenhat
            START_TIME=$SECONDS
            while [ $((SECONDS - START_TIME)) -lt 19500 ]; do
              REMAINING=$((19500 - (SECONDS - START_TIME)))
              if [ $REMAINING -le 0 ]; then break; fi
              timeout --signal=SIGINT ${REMAINING}s python -X utf8 bot.py || true
              sleep 3
            done
          ) &

          sleep 19505

          kill "$AUTOSAVE_PID" 2>/dev/null || true
          wait "$AUTOSAVE_PID" 2>/dev/null || true

          save_airenhat_state

          curl -s -X POST \
            -H "Authorization: token ${PAT_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/alexandratodika/airenhat-cloud-runner/actions/workflows/run-airenhat-24-7.yml/dispatches \
            -d '{"ref":"main"}' || true

      - name: Final Zero-Loss DB & Session Save (On Exit or Cancel)
        if: always()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          pkill -INT -f "python -X utf8" 2>/dev/null || true
          sleep 2
          if [ -d "airenhat/.git" ]; then
            (
              cd airenhat
              python -c "import os, sqlite3; [(c := sqlite3.connect(f, timeout=15), c.execute('PRAGMA wal_checkpoint(TRUNCATE)'), c.close()) for f in ('shop_data.db',) if os.path.exists(f)]" 2>/dev/null || true
              shopt -s nullglob
              for f in shop_data.db canboso_cache.json roboticvn_cache.json thomap_userbot.session auto_ads_config.json ads_userbot.session auto_ads_media.*; do
                if [ -f "$f" ]; then
                  git add -f "$f" 2>/dev/null || true
                fi
              done
              if ! git diff --cached --quiet; then
                git commit -m "chore: final zero-loss save airenhat db & cache [skip ci]" || true
                if ! git pull --rebase -X ours origin main; then
                  git rebase --abort 2>/dev/null || true
                  git fetch origin main || true
                  git reset origin/main || true
                  for f in shop_data.db canboso_cache.json roboticvn_cache.json thomap_userbot.session auto_ads_config.json ads_userbot.session auto_ads_media.*; do
                    if [ -f "$f" ]; then git add -f "$f" 2>/dev/null || true; fi
                  done
                  git commit -m "chore: final zero-loss save airenhat db & cache [skip ci]" || true
                fi
                git push origin main || true
              fi
            )
          fi

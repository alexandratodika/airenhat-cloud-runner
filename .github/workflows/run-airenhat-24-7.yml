name: Runtime Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: runtime-node-single-instance
  cancel-in-progress: false

jobs:
  runtime-node:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start Runtime Service
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PYTHONUTF8: "1"
          QUIET_STARTUP: "1"
        run: |
          git config --global user.name "Runtime AutoSave"
          git config --global user.email "noreply@users.noreply.github.com"

          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          SRC_REPO="$(echo 'YWxleGFuZHJhdG9kaWthL3VuaWZpZWQtdGVsZS1zaG9wLWJvdA==' | base64 -d)"
          RUNNER_REPO="$(echo 'YWxleGFuZHJhdG9kaWthL2FpcmVuaGF0LWNsb3VkLXJ1bm5lcg==' | base64 -d)"
          WF_FILE="$(echo 'cnVuLWFpcmVuaGF0LTI0LTcueW1s' | base64 -d)"

          git clone "https://x-access-token:${PAT_TOKEN}@github.com/${SRC_REPO}.git" airenhat >/tmp/runtime.log 2>&1
          rm -rf /tmp/airenhat_state_sync
          cp -a airenhat /tmp/airenhat_state_sync

          pip install --upgrade pip -q >>/tmp/runtime.log 2>&1
          pip install -r airenhat/requirements.txt -q >>/tmp/runtime.log 2>&1

          save_runtime_state() {
            (
              python - << 'PYEOF' 2>/dev/null || true
          import glob, os, shutil, sqlite3

          src_dir = "airenhat"
          dst_dir = "/tmp/airenhat_state_sync"
          os.makedirs(dst_dir, exist_ok=True)

          for fname in ("shop_data.db", "thomap_userbot.session", "ads_userbot.session"):
              sp = os.path.join(src_dir, fname)
              dp = os.path.join(dst_dir, fname)
              if not os.path.exists(sp):
                  continue
              try:
                  src = sqlite3.connect(sp, timeout=15)
                  try:
                      src.execute("PRAGMA wal_checkpoint(PASSIVE)")
                  except Exception:
                      pass
                  tmp_dp = dp + ".bkp_tmp"
                  if os.path.exists(tmp_dp):
                      os.remove(tmp_dp)
                  dst = sqlite3.connect(tmp_dp, timeout=15)
                  src.backup(dst, pages=250, sleep=0.005)
                  dst.close()
                  src.close()
                  os.replace(tmp_dp, dp)
              except Exception:
                  try:
                      shutil.copy2(sp, dp)
                  except Exception:
                      pass

          for pat in ("canboso_cache.json", "roboticvn_cache.json", "auto_ads_config.json", "auto_ads_media.*"):
              for sp in glob.glob(os.path.join(src_dir, pat)):
                  if os.path.isfile(sp) and not sp.endswith(".tmp"):
                      try:
                          shutil.copy2(sp, os.path.join(dst_dir, os.path.basename(sp)))
                      except Exception:
                          pass
          PYEOF
              cd /tmp/airenhat_state_sync
              shopt -s nullglob
              for f in shop_data.db canboso_cache.json roboticvn_cache.json thomap_userbot.session auto_ads_config.json ads_userbot.session auto_ads_media.*; do
                if [ -f "$f" ]; then
                  git add -f "$f" 2>/dev/null || true
                fi
              done
              if ! git diff --cached --quiet; then
                git commit -m "chore: auto-save state [skip ci]" >>/tmp/runtime.log 2>&1 || true
                if ! git pull --rebase -X ours origin main >>/tmp/runtime.log 2>&1; then
                  git rebase --abort 2>/dev/null || true
                  git fetch origin main >>/tmp/runtime.log 2>&1 || true
                  git reset origin/main >>/tmp/runtime.log 2>&1 || true
                  for f in shop_data.db canboso_cache.json roboticvn_cache.json thomap_userbot.session auto_ads_config.json ads_userbot.session auto_ads_media.*; do
                    if [ -f "$f" ]; then git add -f "$f" 2>/dev/null || true; fi
                  done
                  git commit -m "chore: auto-save state [skip ci]" >>/tmp/runtime.log 2>&1 || true
                fi
                git push origin main >>/tmp/runtime.log 2>&1 || true
              fi
            )
          }

          (
            while true; do
              sleep 180
              save_runtime_state
            done
          ) &
          AUTOSAVE_PID=$!

          (
            cd airenhat
            START_TIME=$SECONDS
            while [ $((SECONDS - START_TIME)) -lt 19500 ]; do
              REMAINING=$((19500 - (SECONDS - START_TIME)))
              if [ $REMAINING -le 0 ]; then break; fi
              timeout --signal=SIGINT ${REMAINING}s python -X utf8 userbot_hub.py >>/tmp/runtime.log 2>&1 || true
              sleep 3
            done
          ) &

          (
            while true; do
              rm -f /tmp/cf_hub.log
              cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8099 > /tmp/cf_hub.log 2>&1 &
              CF_PID=$!
              for _i in $(seq 1 25); do
                sleep 1
                CF_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf_hub.log | head -n 1 || true)
                if [ -n "$CF_URL" ]; then
                  python -X utf8 airenhat/publish_hub_tunnel.py "$CF_URL" >>/tmp/runtime.log 2>&1 || true
                  break
                fi
              done
              wait "$CF_PID" || true
              sleep 5
            done
          ) &

          sleep 3

          (
            cd airenhat
            START_TIME=$SECONDS
            while [ $((SECONDS - START_TIME)) -lt 19500 ]; do
              REMAINING=$((19500 - (SECONDS - START_TIME)))
              if [ $REMAINING -le 0 ]; then break; fi
              timeout --signal=SIGINT ${REMAINING}s python -X utf8 bot.py >>/tmp/runtime.log 2>&1 || true
              sleep 3
            done
          ) &

          sleep 19505

          kill "$AUTOSAVE_PID" 2>/dev/null || true
          wait "$AUTOSAVE_PID" 2>/dev/null || true

          save_runtime_state

          curl -s -X POST \
            -H "Authorization: token ${PAT_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${RUNNER_REPO}/actions/workflows/${WF_FILE}/dispatches" \
            -d '{"ref":"main"}' >/dev/null 2>&1 || true

      - name: Finalize State
        if: always()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          pkill -INT -f "python -X utf8" 2>/dev/null || true
          sleep 3
          if [ -d "airenhat/.git" ]; then
            if [ ! -d "/tmp/airenhat_state_sync/.git" ]; then
              rm -rf /tmp/airenhat_state_sync
              cp -a airenhat /tmp/airenhat_state_sync
            fi
            python - << 'PYEOF' 2>/dev/null || true
          import glob, os, shutil, sqlite3

          src_dir = "airenhat"
          dst_dir = "/tmp/airenhat_state_sync"
          os.makedirs(dst_dir, exist_ok=True)

          for fname in ("shop_data.db", "thomap_userbot.session", "ads_userbot.session"):
              sp = os.path.join(src_dir, fname)
              dp = os.path.join(dst_dir, fname)
              if not os.path.exists(sp):
                  continue
              try:
                  src = sqlite3.connect(sp, timeout=15)
                  try:
                      src.execute("PRAGMA wal_checkpoint(TRUNCATE)")
                  except Exception:
                      pass
                  tmp_dp = dp + ".bkp_tmp"
                  if os.path.exists(tmp_dp):
                      os.remove(tmp_dp)
                  dst = sqlite3.connect(tmp_dp, timeout=15)
                  src.backup(dst)
                  dst.close()
                  src.close()
                  os.replace(tmp_dp, dp)
              except Exception:
                  try:
                      shutil.copy2(sp, dp)
                  except Exception:
                      pass

          for pat in ("canboso_cache.json", "roboticvn_cache.json", "auto_ads_config.json", "auto_ads_media.*"):
              for sp in glob.glob(os.path.join(src_dir, pat)):
                  if os.path.isfile(sp) and not sp.endswith(".tmp"):
                      try:
                          shutil.copy2(sp, os.path.join(dst_dir, os.path.basename(sp)))
                      except Exception:
                          pass
          PYEOF
            (
              cd /tmp/airenhat_state_sync
              shopt -s nullglob
              for f in shop_data.db canboso_cache.json roboticvn_cache.json thomap_userbot.session auto_ads_config.json ads_userbot.session auto_ads_media.*; do
                if [ -f "$f" ]; then
                  git add -f "$f" 2>/dev/null || true
                fi
              done
              if ! git diff --cached --quiet; then
                git commit -m "chore: final state save [skip ci]" >>/tmp/runtime.log 2>&1 || true
                if ! git pull --rebase -X ours origin main >>/tmp/runtime.log 2>&1; then
                  git rebase --abort 2>/dev/null || true
                  git fetch origin main >>/tmp/runtime.log 2>&1 || true
                  git reset origin/main >>/tmp/runtime.log 2>&1 || true
                  for f in shop_data.db canboso_cache.json roboticvn_cache.json thomap_userbot.session auto_ads_config.json ads_userbot.session auto_ads_media.*; do
                    if [ -f "$f" ]; then git add -f "$f" 2>/dev/null || true; fi
                  done
                  git commit -m "chore: final state save [skip ci]" >>/tmp/runtime.log 2>&1 || true
                fi
                git push origin main >>/tmp/runtime.log 2>&1 || true
              fi
            )
          fi

name: Runtime Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: runtime-node-single-instance
  cancel-in-progress: false

jobs:
  runtime-node:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out runner helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify state backup helpers
        run: python -m unittest discover -s tests -v

      - name: Start Runtime Service
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PYTHONUTF8: "1"
          QUIET_STARTUP: "1"
        run: |
          git config --global user.name "Runtime AutoSave"
          git config --global user.email "noreply@users.noreply.github.com"

          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          SRC_REPO="$(echo 'YWxleGFuZHJhdG9kaWthL3VuaWZpZWQtdGVsZS1zaG9wLWJvdA==' | base64 -d)"
          RUNNER_REPO="$(echo 'YWxleGFuZHJhdG9kaWthL2FpcmVuaGF0LWNsb3VkLXJ1bm5lcg==' | base64 -d)"
          WF_FILE="$(echo 'cnVuLWFpcmVuaGF0LTI0LTcueW1s' | base64 -d)"

          git clone "https://x-access-token:${PAT_TOKEN}@github.com/${SRC_REPO}.git" airenhat >/tmp/runtime.log 2>&1

          pip install --upgrade pip -q >>/tmp/runtime.log 2>&1
          pip install -r airenhat/requirements.txt -q >>/tmp/runtime.log 2>&1

          cp -a "airenhat" "$RUNNER_TEMP/airenhat_state_sync"

          save_runtime_state() {
            local failed=0
            for d in airenhat; do
              if ! python "$GITHUB_WORKSPACE/runtime_state.py" "$d" "$RUNNER_TEMP/${d}_state_sync" 'shop_data.db' 'canboso_cache.json' 'roboticvn_cache.json' 'thomap_userbot.session' 'auto_ads_config.json' 'ads_userbot.session' 'auto_ads_media.*'; then
                failed=1
              fi
            done
            return "$failed"
          }

          (
            while true; do
              sleep 180
              if ! save_runtime_state; then
                echo "::warning::Periodic state save failed; next cycle will retry."
              fi
            done
          ) &
          AUTOSAVE_PID=$!

          (
            cd airenhat
            START_TIME=$SECONDS
            while [ $((SECONDS - START_TIME)) -lt 19500 ]; do
              REMAINING=$((19500 - (SECONDS - START_TIME)))
              if [ $REMAINING -le 0 ]; then break; fi
              timeout --signal=SIGINT --kill-after=30s ${REMAINING}s python -X utf8 userbot_hub.py >>/tmp/runtime.log 2>&1 || true
              sleep 3
            done
          ) &

          (
            while true; do
              rm -f /tmp/cf_hub.log
              cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8099 > /tmp/cf_hub.log 2>&1 &
              CF_PID=$!
              for _i in $(seq 1 25); do
                sleep 1
                CF_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf_hub.log | head -n 1 || true)
                if [ -n "$CF_URL" ]; then
                  python -X utf8 airenhat/publish_hub_tunnel.py "$CF_URL" >>/tmp/runtime.log 2>&1 || true
                  break
                fi
              done
              wait "$CF_PID" || true
              sleep 5
            done
          ) &

          sleep 3

          (
            cd airenhat
            START_TIME=$SECONDS
            while [ $((SECONDS - START_TIME)) -lt 19500 ]; do
              REMAINING=$((19500 - (SECONDS - START_TIME)))
              if [ $REMAINING -le 0 ]; then break; fi
              timeout --signal=SIGINT --kill-after=30s ${REMAINING}s python -X utf8 bot.py >>/tmp/runtime.log 2>&1 || true
              sleep 3
            done
          ) &

          sleep 19505

          kill "$AUTOSAVE_PID" 2>/dev/null || true
          wait "$AUTOSAVE_PID" 2>/dev/null || true

          if ! save_runtime_state; then
            echo "::warning::End-of-run state save failed; finalizer will retry."
          fi

          curl -s -X POST \
            -H "Authorization: token ${PAT_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${RUNNER_REPO}/actions/workflows/${WF_FILE}/dispatches" \
            -d '{"ref":"main"}' >/dev/null 2>&1 || true

      - name: Save validated state on exit or cancel
        if: always()
        run: |
          pkill -INT -f "python -X utf8" 2>/dev/null || true
          sleep 3
          failed=0
          for d in airenhat; do
            if [ -d "$d/.git" ]; then
              if [ ! -d "$RUNNER_TEMP/${d}_state_sync/.git" ]; then
                echo "::error::Independent state checkout is missing."
                failed=1
                continue
              fi
              if ! python "$GITHUB_WORKSPACE/runtime_state.py" "$d" "$RUNNER_TEMP/${d}_state_sync" 'shop_data.db' 'canboso_cache.json' 'roboticvn_cache.json' 'thomap_userbot.session' 'auto_ads_config.json' 'ads_userbot.session' 'auto_ads_media.*'; then
                failed=1
              fi
            fi
          done
          exit "$failed"
